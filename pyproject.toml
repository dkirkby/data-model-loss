[project]
name = "data-model-loss"
version = "0.1.0"
description = "Offline data and model pipeline for the loss-function visualizer"
authors = [
    { name = "David Kirkby", email = "dkirkby@uci.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# A script-only pipeline, not an importable/installable package: `uv run`
# provides the environment, `python/generate_data.py` is the entry point.
package = false
